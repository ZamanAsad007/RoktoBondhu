services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: roktobondhu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-roktobondhu}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-roktobondhu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roktobondhu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: roktobondhu-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    container_name: roktobondhu-core-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-roktobondhu}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-blood_donation_access_secret_key_32bytes_or_more_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-blood_donation_refresh_secret_key_32bytes_or_more_change_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: roktobondhu-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-roktobondhu}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAILPIT_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: roktobondhu-frontend
    restart: unless-stopped
    ports:
      - "3000:80"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: roktobondhu-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - core-api
      - frontend

volumes:
  pgdata:
  redisdata:
